<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="../Css/shops.css">
  <title>Stalls</title>
</head>
<body>
  <div class="top-bar box">
    <div class="top-bar left">
      <img src="../Picture/menuBar.svg" class="menuBar svg">
    </div>
    <div class="top-bar mid">
      <img src="../Picture/logo2.png" class="logo image">
    </div>
    <div class="top-bar right">
      <img src="../Picture/logout.svg" class="profile svg">
    </div>
  </div>
  <div class="container">
      <div class="search-bar">
        <input type="text" placeholder="Search stalls, food, and drinks">
        <button class="search-button">&#128269;</button>
        <button class="cart-button">Cart</button>
      </div>
    
    <div class="stall-list">
      <div class="stall-card" onclick="window.location.href='../Html/stall1.html'">
        <img src="https://i.imgur.com/9JonHif.jpeg"></img>
        <div class="stall-info">
          <h2 class="stall-title">Soon Apam Balik</h2>
          <p class="stall-category">Apam Balik</p>
          <p class="stall-rating">⭐ 4.7 | Pick up in 8 mins</p>
        </div>
      </div>

      <div class="stall-card" onclick="window.location.href='../Html/stall2.html'">
        <img src="../Picture/2tofu.png" alt="Stall 2" class="stall-image">
        <div class="stall-info">
          <h2 class="stall-title">Chew Chew Chow Tofu</h2>
          <p class="stall-category">Chinese, Snack</p>
          <p class="stall-rating">⭐ 4.6 | Pick up in 12 mins</p>
        </div>
      </div>
      
      <!-- Add more stall cards as needed -->

    </div>
  </div>
</body>
</html>
