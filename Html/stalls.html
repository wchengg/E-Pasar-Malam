<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="../Css/stalls.css">
  <title>ePasar Malam Stalls</title>
</head>
<body>
  <div class="container">
    <div class="search-bar">
      <input type="text" placeholder="Search stalls, food, and drinks">
      <button class="search-button">&#128269;</button>
      <button class="cart-button">Cart</button>
    </div>
    
    <div class="stall-list">
      <div class="stall-card">
        <img src="stall1.jpg" alt="Stall 1" class="stall-image">
        <div class="stall-info">
          <h2 class="stall-title">Saffron Shawarma - Heritage Lane</h2>
          <p class="stall-category">Sandwich & Wraps</p>
          <p class="stall-rating">⭐ 4.5 | Pick up in 8 mins</p>
        </div>
      </div>

      <div class="stall-card">
        <img src="stall2.jpg" alt="Stall 2" class="stall-image">
        <div class="stall-info">
          <h2 class="stall-title">Granny's Mansion SS2</h2>
          <p class="stall-category">Non-Halal, Porridge, Noodles, Snack</p>
          <p class="stall-rating">⭐ 4.5 | Pick up in 10 mins</p>
        </div>
      </div>
      
      <!-- Add more stall cards as needed -->

    </div>
  </div>
</body>
</html>
